<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Practice</title>
</head>
<body>

<strike><center><h1 style="border:4px solid red; display: inline-block; padding: 10px; background-color: lightskyblue;">EXAM!!</h1></center></strike>

<script>
document.write("<center><h1>1. Operators</h1></center>");

let a = 10;
let b = 3;


document.write("<center><h1>Arithmetic Operators</h1></center>");
document.write("Addition: " + (a + b) + "<br>");
document.write("Subtraction: " + (a - b) + "<br>");
document.write("Multiplication: " + (a * b) + "<br>");
document.write("Division: " + (a / b) + "<br>");
document.write("Modulus: " + (a % b) + "<br>");


document.write("<center><h1>Comparison Operators</h1></center>");
document.write("a == b: " + (a == b) + "<br>");
document.write("a === b: " + (a === b) + "<br>");
document.write("a != b: " + (a != b) + "<br>");
document.write("a > b: " + (a > b) + "<br>");
document.write("a < b: " + (a < b) + "<br>");
document.write("a >= b: " + (a >= b) + "<br>");
document.write("a <= b: " + (a <= b) + "<br>");


document.write("<center><h1>Logical Operators</h1></center>");
document.write((a > 5 && b < 5) + "<br>");
document.write((a < 5 || b < 5) + "<br>");
document.write((!(a > 5)) + "<br>");



document.write("<center><h1>2. Conditional Statements</h1></center>");

let marks = 85;


if (marks >= 0) {
    document.write("If: Marks are valid.<br>");
}


if (marks >= 40) {
    document.write("If-Else: Pass<br>");
} else {
    document.write("If-Else: Fail<br>");
}


if (marks >= 90) {
    document.write("Grade: A+<br>");
} else if (marks >= 80) {
    document.write("Grade: A<br>");
} else if (marks >= 60) {
    document.write("Grade: B<br>");
} else if (marks >= 40) {
    document.write("Grade: C<br>");
} else {
    document.write("Grade: Fail<br>");
}

document.write ("<center><h4>Switch Statement</h4></center>");
let day = 5;

switch (day) {
    case 1:
        document.write("Monday<br>");
        break;
    case 2:
        document.write("tuesday<br>");
        break;
    case 3:
        document.write("Wednesday<br>");
        break;
    default:
        document.write("Invalid day<br>");
}


document.write ("<center><h1>3.LOOPS In JavaScript</h1></center>");
document.write("<h2>~For Loop</h2>");

for (let i = 1; i <= 5; i++) {
    document.write(i + "<br>");
}

document.write("<h2>~While Loop</h2>");

let j = 1;

while (j <= 5) {
    document.write(j + "<br>");
    j++;
}


document.write("<h2>~Do-While Loop</h2>");

let k = 1;

do {
    document.write(k + "<br>");
    k++;
} while (k <= 5);


document.write("<h2>~For-In Loop</h2>");

let student = {
    name: "Shahid",
    age: 20,
    city: "Sopore"
};

for (let key in student) {
    document.write(key + ": " + student[key] + "<br>");
}


document.write("<h2>~For-Of Loop</h2>");

let fruits = ["Apple", "Mango", "Orange"];

for (let fruit of fruits) {
    document.write(fruit + "<br>");
}

</script>

</body>
</html>
