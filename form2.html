<!DOCTYPE html>
<html>
<head>
    <title>Registration Form</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background-image: url("https://cdn.pixabay.com/photo/2019/10/02/04/40/registration-4519979_1280.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            text-align: center;
        }

        h1 {
            color: blue;
            margin-top: 30px;
        }

        /* Only registration details box */
        .form-box {
            width: 400px;
            margin: 30px auto;
            padding: 25px;
            border: 3px solid red;
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.25);
        }

        label {
            font-size: 18px;
        }

        input, textarea {
            padding: 8px;
            margin: 5px;
        }

        button, input[type="submit"], input[type="reset"] {
            padding: 8px 15px;
            margin: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1><big><button style="color: blue"><b><big>REGISTRATION FORM!</big></b></button></big></h1>

    <div class="form-box">

        <form>

            <label>Name:</label><br>
            <input type="text" placeholder="Your Name"><br><br>

            <label>Email:</label><br>
            <input type="email" placeholder="abc@gmail.com"><br><br>

            <label>Password:</label><br>
            <input type="password" placeholder="Strong Password"><br><br>

            <label>Phone Number:</label><br>
            <input type="tel" placeholder="1234567"><br><br>

            <label>Gender:</label><br>
            <input type="radio" name="gender"> Male
            <input type="radio" name="gender"> Female
            <br><br>

            <label>Date of Birth:</label><br>
            <input type="date"><br><br>

            <label>Address:</label><br>
            <textarea rows="3" cols="30"></textarea><br><br>

            <input type="submit" value="Register">
            <input type="reset" value="Clear">

        </form>

    </div>

</body>
</html>
