<body>
   <center><big><strong><b>   
  <form style="border:9px solid black; display: inline-block; padding: 10px; background-color: aqua;">

    </form>
 <form style="border:9px solid black; display: inline-block; padding: 10px; vertical-align: top; background-color: aqua;">

        <input style="background-color: bisque;" type="number" id="num3" placeholder="enter first number"> <br><br>

        <button type="button" onclick="subNumbers()" style="background-color: red;"> <b>-</b> </button> <br><br>

    </form>
     <form style="border:9px solid black; display: inline-block; padding: 10px; vertical-align: top; background-color: aqua;">

        <input style="background-color: bisque;" type="number" id="num5" placeholder="enter first number"> <br><br>
        <label>ENTER SECOND NUMBER</label> <br>
        <input style="background-color: bisque;" type="number" id="num6" placeholder="enter second number"> <br><br>

</b></strong></big></center>
