<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loops</title>
</head>
<body>
   <b><strong> <center><h1 style="background-color: rgb(38, 38, 233);">FOR  LOOP  IN  [JavaScript]</h1></center>
    <center><big><strong><script>
        for(i=0;i<=10;i++)
    {
        document.write(i + "<br>");
    }
    </script></strong></big></center>
<center><h1 style="background-color: rgb(190, 101, 101);">WHILE  LOOP  IN  [JavaScript]</h1></center>   
 <center><big><strong><script>
        k=0;
        while(k<=10)
    {
        document.write(k + "<br>");
        k++;
    }
    </script></strong></big></center>
    <center><h1 style="background-color: rgb(112, 48, 172);">DO  WHILE  LOOPS  IN  [JavaScript]</h1></center>
    <center><big><strong><script>
        j=1;
        do{
        document.write(j + "<br>");
            j++;
        }
        while(j<=10);
    </script></strong></big></center></strong></b>
</body>
</html>
